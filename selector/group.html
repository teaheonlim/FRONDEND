  <head>

    <title>Document</title>
    <style>
      /*선택자
        1) 태그 선택자
        2) 아이디 선택자
        3) 클래스 선택자
        4) 전체 선택자 : *
        5) 자손 선택자 : 공백
        6) 자식 선택자 : >
        7) 인접형제 선택자 : + (뒤에 따라나오는 첫번째 요소만) + or ~ (뒤에 따라나오는 모든 요소)
        8) 그룹화
        9) 속성 선택자 : [class=''], [id=''], [속성명^=값] : 값으로 시작하는
           [속성명&값] : 값으로 끝하는
           [속성명]
           [속성명~=값] : 값이 포함된
        10) 가상 클래스 선택자
         a : 밑줄, 파란색
            active : 빨강색
            visited : 보라색

            :hover : 요소에 마우스 올려놓았을 때
            :checked, :disabled

          11) 가상 요소 선택자
            ::after, ::before

          12) 구조 선택자
            :first-child, :last-child, :nth-child
            :first-of-type, :last-of-type, :nth-of-type

          13) not(선택자) : 해당 선택자가 아닌
      */
      #title1,
      nav #title2 {
        color:brown;
      }
      #title1:hover {
        background-color: orange;
      }
      a




       .box {
        width: 100px;
        height: 100px;

       }
    </style>
  </head>
