<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .text-danger {
        color: red;
        display: none;
      }
    </style>
  </head>
  <body>
    <form action="" method="get">
      <div>
        <label for="userid">아이디</label>
        <input type="text" name="userid" id="userid" />
        <div class="text-danger">이름을 입력해 주세요</div>
      </div>
      <div>
        <label for="fruits">비밀번호</label>
        <input type="checkbox" name="fruits" id="" value="사과" />사과
        <input type="checkbox" name="fruits" id="" value="포도" />포도
        <input type="checkbox" name="fruits" id="" value="수박" />수박
        <input type="checkbox" name="fruits" id="" value="딸기" />딸기
        <div class="text-danger">과일을 선택해 주세요</div>
      </div>
      <button type="submit">전송</button>
    </form>
    <script>
      // submit 이벤트
      // 검증 alert()
      document.querySelector("form").addEventListener("submit", (e) => {
        e.preventDefault();

        const form = e.target;

        if (form.userid.value === "") {
          alert("아이디 입력");
          form.userid.focus();
          return;
        } else if (form.password.value === "") {
          alert("비밀번호 입력");
          form.password.focus();
          return;
        } else if (form.tel.value === "") {
          alert("전화번호 입력");
          form.tel.focus();
          return;
        }

        form.submit();
      });
    </script>
  </body>
</html>
